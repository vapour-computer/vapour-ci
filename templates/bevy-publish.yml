name: vapour-publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install trunk
        run: cargo install trunk --locked
      - name: Build for web
        run: trunk build --release --public-url ./ --dist build/web
      - name: Resolve publish version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: vapour-computer/vapour-ci@06971738215ae4fc523af53dbd60d942fbad270a # main
        with:
          token: ${{ secrets.VAPOUR_TOKEN }}
          version: ${{ steps.version.outputs.value }}
          notes: "Release ${{ github.ref_name }}"
