name: vapour-publish
on:
  push:
    tags: ["v*"]
env:
  GODOT_VERSION: "4.7.2"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true
      - name: Export for web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - name: Resolve publish version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: vapour-computer/vapour-ci@06971738215ae4fc523af53dbd60d942fbad270a # main
        with:
          token: ${{ secrets.VAPOUR_TOKEN }}
          version: ${{ steps.version.outputs.value }}
          notes: "Release ${{ github.ref_name }}"
