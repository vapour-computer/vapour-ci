name: vapour-publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { lfs: true }
      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildsPath: build
      - name: Move build into place
        run: mkdir -p build/web && cp -r build/WebGL/WebGL/. build/web/
      - name: Resolve publish version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: vapour-computer/vapour-ci@06971738215ae4fc523af53dbd60d942fbad270a # main
        with:
          token: ${{ secrets.VAPOUR_TOKEN }}
          version: ${{ steps.version.outputs.value }}
          notes: "Release ${{ github.ref_name }}"
